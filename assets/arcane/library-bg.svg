<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050914"/><stop offset=".32" stop-color="#0b1325"/><stop offset=".7" stop-color="#080e1b"/><stop offset="1" stop-color="#03070e"/></linearGradient>
  <radialGradient id="dome" cx="50%" cy="9%" r="58%"><stop offset="0" stop-color="#253b79" stop-opacity=".48"/><stop offset=".38" stop-color="#16254f" stop-opacity=".18"/><stop offset="1" stop-color="#06101f" stop-opacity="0"/></radialGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#060811"/><stop offset=".5" stop-color="#17172a"/><stop offset="1" stop-color="#060811"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211727"/><stop offset=".5" stop-color="#110d17"/><stop offset="1" stop-color="#08070c"/></linearGradient>
  <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff0b0"/><stop offset=".15" stop-color="#f6c665" stop-opacity=".95"/><stop offset=".45" stop-color="#d28a35" stop-opacity=".34"/><stop offset="1" stop-color="#d28a35" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff7c8"/><stop offset=".08" stop-color="#f7d784"/><stop offset=".26" stop-color="#9e79da" stop-opacity=".56"/><stop offset="1" stop-color="#6d5fc9" stop-opacity="0"/></radialGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1425"/><stop offset="1" stop-color="#02050b"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="stars" width="120" height="100" patternUnits="userSpaceOnUse"><circle cx="18" cy="17" r="1.4" fill="#dce7ff" opacity=".55"/><circle cx="87" cy="31" r="1" fill="#f3d893" opacity=".42"/><circle cx="57" cy="82" r="1.2" fill="#a8b9dc" opacity=".46"/></pattern>
</defs>

<rect width="1080" height="1920" fill="url(#night)"/>
<rect width="1080" height="1920" fill="url(#dome)"/>

<!-- celestial ceiling -->
<g opacity=".52"><rect x="154" y="0" width="772" height="470" fill="url(#stars)"/>
<g fill="none" stroke="#7d91bd" opacity=".34"><circle cx="540" cy="160" r="235"/><circle cx="540" cy="160" r="180"/><circle cx="540" cy="160" r="126"/><ellipse cx="540" cy="160" rx="292" ry="82" transform="rotate(-12 540 160)"/><path d="M315 194L394 91L496 145L601 71L740 179L665 298L538 252L452 318Z"/></g>
