      <path d="M0-60L12-12L60 0L12 12L0 60L-12 12L-60 0L-12-12Z" fill="#f2dda0"/>
      <path d="M0-28L5-5L28 0L5 5L0 28L-5 5L-28 0L-5-5Z" fill="#fff7d5"/>
