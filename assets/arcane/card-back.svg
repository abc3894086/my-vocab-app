  <g transform="translate(360 605)">
    <path d="M-88-31Q-45-47 0-13Q45-47 88-31V43Q42 26 0 60Q-42 26-88 43Z" fill="#0b142c" stroke="url(#metal)" stroke-width="5"/>
    <path d="M0-13V60" stroke="#d5b56e" stroke-width="3"/>
    <path d="M-73-19Q-39-28-13-7V39Q-42 20-73 28ZM73-19Q39-28 13-7V39Q42 20 73 28Z" fill="none" stroke="#a9b8d4" stroke-width="2"/>
    <path d="M-60 3Q-38-3-19 8M60 3Q38-3 19 8M-60 15Q-38 9-19 20M60 15Q38 9 19 20" fill="none" stroke="#7f91b4" stroke-width="1.3" opacity=".7"/>
  </g>

  <text x="360" y="878" text-anchor="middle" fill="#d8c17e" font-family="Georgia,serif" font-size="21" letter-spacing="7">ARCANE LIBRARY</text>
  <text x="360" y="910" text-anchor="middle" fill="#8ea0bf" font-family="Georgia,serif" font-size="11" letter-spacing="5">CELESTIAL CODEX</text>
