    <circle r="236" stroke="#d5b56e" stroke-width="1.2" opacity=".42" stroke-dasharray="3 8"/>
    <circle r="196" stroke="#899bc0" stroke-width="1.5" opacity=".5"/>
    <circle r="153" stroke="#d5b56e" stroke-width="1" opacity=".36" stroke-dasharray="2 6"/>
    <circle r="112" stroke="#98a9c9" stroke-width="1.4" opacity=".55"/>
    <ellipse rx="289" ry="78" transform="rotate(-17)" stroke="#8799bd" stroke-width="1.5" opacity=".48"/>
    <ellipse rx="255" ry="66" transform="rotate(38)" stroke="#d5b56e" stroke-width="1" opacity=".35"/>
    <ellipse rx="220" ry="56" transform="rotate(72)" stroke="#899bc0" stroke-width="1.2" opacity=".4"/>
