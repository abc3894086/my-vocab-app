<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" preserveAspectRatio="none">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e5b1"/><stop offset=".14" stop-color="#8ea0c1"/><stop offset=".3" stop-color="#d7b96f"/><stop offset=".52" stop-color="#6e7d9a"/><stop offset=".72" stop-color="#caa65e"/><stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <radialGradient id="night" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#1c2d5c"/><stop offset=".42" stop-color="#111a35"/><stop offset=".77" stop-color="#090f20"/><stop offset="1" stop-color="#040812"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9f91ff" stop-opacity=".42"/><stop offset=".48" stop-color="#6f5bd2" stop-opacity=".12"/><stop offset="1" stop-color="#6f5bd2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#00030a" flood-opacity=".78"/></filter>
    <pattern id="stars" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="18" r="1" fill="#d9e3f6" opacity=".35"/>
      <circle cx="67" cy="31" r="1.5" fill="#f0d995" opacity=".24"/>
      <circle cx="39" cy="72" r=".9" fill="#b6c8e8" opacity=".32"/>
    </pattern>
  </defs>

  <rect x="18" y="18" width="684" height="1044" rx="62" fill="#02050d" opacity=".97" filter="url(#shadow)"/>
  <rect x="31" y="31" width="658" height="1018" rx="51" fill="url(#night)" stroke="#1e2c4b" stroke-width="18"/>
  <rect x="39" y="39" width="642" height="1002" rx="46" fill="none" stroke="url(#metal)" stroke-width="9"/>
  <rect x="53" y="53" width="614" height="974" rx="37" fill="url(#stars)" stroke="#a8b7d4" stroke-width="2" opacity=".92"/>
  <rect x="65" y="65" width="590" height="950" rx="30" fill="none" stroke="#b9914e" stroke-width="1.5" opacity=".55"/>

  <!-- astronomical field -->
  <circle cx="360" cy="532" r="290" fill="url(#aura)"/>
  <g fill="none" transform="translate(360 532)">
