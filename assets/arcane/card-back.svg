  <g fill="#f0d99a" opacity=".84">
    <circle cx="92" cy="140" r="3"/><circle cx="130" cy="122" r="3"/><circle cx="154" cy="153" r="3"/><circle cx="187" cy="137" r="3"/>
    <circle cx="533" cy="143" r="3"/><circle cx="562" cy="119" r="3"/><circle cx="596" cy="140" r="3"/><circle cx="627" cy="111" r="3"/>
    <circle cx="89" cy="922" r="3"/><circle cx="123" cy="949" r="3"/><circle cx="158" cy="931" r="3"/><circle cx="188" cy="959" r="3"/>
    <circle cx="532" cy="952" r="3"/><circle cx="563" cy="922" r="3"/><circle cx="598" cy="944" r="3"/><circle cx="629" cy="913" r="3"/>
  </g>

  <!-- center seal -->
  <g transform="translate(360 532)">
    <circle r="118" fill="#0a1123" stroke="#02050d" stroke-width="13"/>
    <circle r="106" fill="#111c3a" stroke="url(#metal)" stroke-width="6"/>
    <circle r="91" fill="none" stroke="#99a9c7" stroke-width="1.6" opacity=".72"/>
    <circle r="77" fill="none" stroke="#d5b56e" stroke-width="1.3" opacity=".5" stroke-dasharray="3 7"/>
    <g filter="url(#glow)">
