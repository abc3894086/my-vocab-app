<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" preserveAspectRatio="none">
<defs>
  <radialGradient id="night" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#1c2d5a"/><stop offset=".4" stop-color="#101a34"/><stop offset=".78" stop-color="#080e1d"/><stop offset="1" stop-color="#03070f"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2bd"/><stop offset=".12" stop-color="#9d793b"/><stop offset=".28" stop-color="#e9d29a"/><stop offset=".45" stop-color="#6d542d"/><stop offset=".62" stop-color="#cfaa64"/><stop offset=".8" stop-color="#7c6034"/><stop offset="1" stop-color="#ead89e"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eff5ff"/><stop offset=".2" stop-color="#7485a7"/><stop offset=".5" stop-color="#cbd7ea"/><stop offset=".75" stop-color="#55657f"/><stop offset="1" stop-color="#dbe4f1"/></linearGradient>
  <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8579e5" stop-opacity=".28"/><stop offset=".55" stop-color="#6d5ec9" stop-opacity=".08"/><stop offset="1" stop-color="#6d5ec9" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#000" flood-opacity=".76"/></filter>
  <filter id="metalTex" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g" result="f"><feFuncA type="table" tableValues="0 .15"/></feComponentTransfer><feBlend in="SourceGraphic" in2="f" mode="soft-light"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="stars" width="82" height="82" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="1" fill="#e8eef8" opacity=".34"/><circle cx="58" cy="24" r="1.3" fill="#efd893" opacity=".24"/><circle cx="33" cy="65" r=".8" fill="#9db0d4" opacity=".32"/></pattern>
</defs>

<rect x="18" y="18" width="684" height="1044" rx="58" fill="#02050c" filter="url(#shadow)"/>
<rect x="29" y="29" width="662" height="1022" rx="51" fill="url(#night)"/>
<rect x="40" y="40" width="640" height="1000" rx="44" fill="url(#stars)" opacity=".85"/>
