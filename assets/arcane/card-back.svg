    <circle cx="513" cy="272" r="13"/>
    <circle cx="570" cy="435" r="11"/>
    <circle cx="523" cy="695" r="13"/>
    <circle cx="360" cy="840" r="15"/>
    <circle cx="197" cy="695" r="13"/>
    <circle cx="150" cy="435" r="11"/>
    <circle cx="207" cy="272" r="13"/>
