    <path d="M0-286v19 M74-276l-5 18 M143-248l-10 16 M202-202l-14 13 M248-143l-16 10 M276-74l-18 5 M286 0h-19 M276 74l-18-5 M248 143l-16-10 M202 202l-14-13 M143 248l-10-16 M74 276l-5-18 M0 286v-19 M-74 276l5-18 M-143 248l10-16 M-202 202l14-13 M-248 143l16-10 M-276 74l18-5 M-286 0h19 M-276-74l18 5 M-248-143l16 10 M-202-202l14 13 M-143-248l10 16 M-74-276l5 18"/>
