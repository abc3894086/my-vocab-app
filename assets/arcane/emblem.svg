<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Arcane Library celestial emblem</title>
  <desc id="desc">An open book beneath an eight-point star enclosed by celestial orbital rings.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4df9a"/>
      <stop offset="0.42" stop-color="#d5b56e"/>
      <stop offset="1" stop-color="#8f6c35"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#71809b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="209" fill="none" stroke="url(#silver)" stroke-width="4" opacity=".74"/>
  <circle cx="256" cy="256" r="179" fill="none" stroke="#6f74d7" stroke-width="2" stroke-dasharray="4 13" opacity=".78"/>
  <ellipse cx="256" cy="256" rx="210" ry="92" fill="none" stroke="url(#gold)" stroke-width="4" transform="rotate(-18 256 256)" opacity=".9"/>
  <ellipse cx="256" cy="256" rx="192" ry="70" fill="none" stroke="#b9c7e0" stroke-width="2" transform="rotate(43 256 256)" opacity=".55"/>
  <g transform="translate(256 118)" filter="url(#glow)">
    <path d="M0-46 L11-11 L46 0 L11 11 L0 46 L-11 11 L-46 0 L-11-11 Z" fill="url(#gold)"/>
    <path d="M0-25 L6-6 L25 0 L6 6 L0 25 L-6 6 L-25 0 L-6-6 Z" fill="#fff4c7"/>
  </g>
  <g transform="translate(256 304)">
    <path d="M-118-36 Q-60-58 0-10 Q60-58 118-36 L118 70 Q58 50 0 92 Q-58 50-118 70 Z" fill="#111b31" stroke="url(#gold)" stroke-width="7"/>
    <path d="M0-10 V92" stroke="#d5b56e" stroke-width="5"/>
    <path d="M-101-20 Q-52-34-16-3 V66 Q-56 37-101 48 Z" fill="none" stroke="#a9b7d1" stroke-width="3" opacity=".88"/>
    <path d="M101-20 Q52-34 16-3 V66 Q56 37 101 48 Z" fill="none" stroke="#a9b7d1" stroke-width="3" opacity=".88"/>
    <path d="M-78 2 H-29 M-78 19 H-24 M-78 36 H-37 M78 2 H29 M78 19 H24 M78 36 H37" stroke="#71809b" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>
  <circle cx="67" cy="257" r="8" fill="#d5b56e"/>
  <circle cx="445" cy="257" r="8" fill="#d5b56e"/>
  <circle cx="256" cy="465" r="6" fill="#aebcd6"/>
