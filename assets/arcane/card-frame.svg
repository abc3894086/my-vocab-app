<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" preserveAspectRatio="none">
<defs>
  <radialGradient id="field" cx="50%" cy="34%" r="78%"><stop offset="0" stop-color="#182a51"/><stop offset=".42" stop-color="#0e1931"/><stop offset=".8" stop-color="#080e1d"/><stop offset="1" stop-color="#040812"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2c2"/><stop offset=".11" stop-color="#9f7b3d"/><stop offset=".24" stop-color="#ead39a"/><stop offset=".39" stop-color="#6e542d"/><stop offset=".56" stop-color="#d2ad67"/><stop offset=".74" stop-color="#7a6035"/><stop offset=".9" stop-color="#f0dc9f"/><stop offset="1" stop-color="#8b6b37"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5ff"/><stop offset=".2" stop-color="#7182a7"/><stop offset=".5" stop-color="#ccd8eb"/><stop offset=".72" stop-color="#53647e"/><stop offset="1" stop-color="#dae3f1"/></linearGradient>
  <radialGradient id="gem" cx="42%" cy="32%" r="74%"><stop offset="0" stop-color="#fff6c6"/><stop offset=".12" stop-color="#cdd8ff"/><stop offset=".38" stop-color="#746bd8"/><stop offset=".7" stop-color="#1a284e"/><stop offset="1" stop-color="#060b17"/></radialGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8da2ff" stop-opacity=".2"/><stop offset="1" stop-color="#8da2ff" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#000" flood-opacity=".74"/></filter>
  <filter id="metalTex" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="9" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="f"><feFuncA type="table" tableValues="0 .16"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="f" mode="soft-light"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="stars" width="88" height="88" patternUnits="userSpaceOnUse"><circle cx="12" cy="19" r="1.1" fill="#e7edf9" opacity=".26"/><circle cx="65" cy="28" r="1.5" fill="#f0d79a" opacity=".2"/><circle cx="37" cy="69" r=".85" fill="#9eb1d6" opacity=".28"/></pattern>
</defs>

<!-- full card field -->
<rect x="18" y="18" width="684" height="1044" rx="58" fill="#02050c" filter="url(#shadow)"/>
<rect x="29" y="29" width="662" height="1022" rx="51" fill="url(#field)"/>
<rect x="40" y="40" width="640" height="1000" rx="44" fill="url(#stars)" opacity=".72"/>
<ellipse cx="360" cy="522" rx="288" ry="380" fill="url(#halo)"/>

<!-- faint astronomical drafting under the word content -->
<g fill="none" stroke="#758bb6" opacity=".12" stroke-width="1.2">
  <circle cx="360" cy="612" r="190"/><circle cx="360" cy="612" r="142"/><circle cx="360" cy="612" r="92"/>
  <ellipse cx="360" cy="612" rx="250" ry="68" transform="rotate(-14 360 612)"/>
  <ellipse cx="360" cy="612" rx="216" ry="58" transform="rotate(42 360 612)"/>
  <path d="M188 681L244 596L315 641L379 540L468 601L529 554"/>
</g>

<!-- embossed outer bezel -->
<g filter="url(#metalTex)">
  <path fill="url(#silver)" fill-rule="evenodd" d="M22 22H698V1058H22ZM43 43V1037H677V43Z" opacity=".9"/>
  <path fill="url(#gold)" fill-rule="evenodd" d="M34 34H686V1046H34ZM51 51V1029H669V51Z" opacity=".9"/>
</g>
<rect x="55" y="55" width="610" height="970" rx="35" fill="none" stroke="#d7e0ef" stroke-width="2" opacity=".57"/>
<rect x="66" y="66" width="588" height="948" rx="29" fill="none" stroke="#b48d4d" stroke-width="1.5" opacity=".65"/>
<rect x="76" y="76" width="568" height="928" rx="24" fill="none" stroke="#8395ba" stroke-width="1" opacity=".5" stroke-dasharray="2 6"/>

<!-- ornate corner plates -->
<g filter="url(#metalTex)">
  <path d="M50 50h132c-5 58-31 94-84 114H50Z" fill="#0a1328" stroke="url(#gold)" stroke-width="5"/>
  <path d="M670 50H538c5 58 31 94 84 114h48Z" fill="#0a1328" stroke="url(#gold)" stroke-width="5"/>
  <path d="M50 1030h132c-5-58-31-94-84-114H50Z" fill="#0a1328" stroke="url(#gold)" stroke-width="5"/>
  <path d="M670 1030H538c5-58 31-94 84-114h48Z" fill="#0a1328" stroke="url(#gold)" stroke-width="5"/>
</g>
<g fill="none" stroke="#9baccb" stroke-width="1.3" opacity=".58">
  <path d="M60 63h101c-10 38-31 65-69 80"/><path d="M660 63H559c10 38 31 65 69 80"/>
  <path d="M60 1017h101c-10-38-31-65-69-80"/><path d="M660 1017H559c10-38 31-65 69-80"/>
</g>

<!-- four celestial medallions -->
<g stroke="url(#gold)" stroke-width="4.5" fill="#0a142b">
  <circle cx="111" cy="116" r="42"/><circle cx="609" cy="116" r="42"/><circle cx="111" cy="964" r="42"/><circle cx="609" cy="964" r="42"/>
</g>
<g fill="none" stroke="#8fa1c5" opacity=".65">
  <circle cx="111" cy="116" r="31"/><circle cx="609" cy="116" r="31"/><circle cx="111" cy="964" r="31"/><circle cx="609" cy="964" r="31"/>
</g>
<g fill="#f0d99a" filter="url(#glow)">
  <path d="M111 88l6 20 20 8-20 7-6 21-7-21-20-7 20-8z"/>
  <path d="M111 936l6 20 20 8-20 7-6 21-7-21-20-7 20-8z"/>
  <path d="M609 936l6 20 20 8-20 7-6 21-7-21-20-7 20-8z"/>
</g>
<!-- crescent -->
<circle cx="609" cy="116" r="18" fill="#e4ebf6"/><circle cx="620" cy="109" r="19" fill="#0b142a"/>

<!-- side filigree rails -->
<g fill="none" stroke="url(#gold)" stroke-width="3.2" opacity=".86">
  <path d="M69 248l18-27 14 27-14 28-18-28zm0 166l18-27 14 27-14 28-18-28zm0 166l18-27 14 27-14 28-18-28zm0 166l18-27 14 27-14 28-18-28"/>
  <path d="M651 248l-18-27-14 27 14 28 18-28zm0 166l-18-27-14 27 14 28 18-28zm0 166l-18-27-14 27 14 28 18-28zm0 166l-18-27-14 27 14 28 18-28"/>
</g>
<g fill="#aab9d3" opacity=".62"><circle cx="87" cy="332" r="2"/><circle cx="87" cy="498" r="2"/><circle cx="87" cy="664" r="2"/><circle cx="633" cy="332" r="2"/><circle cx="633" cy="498" r="2"/><circle cx="633" cy="664" r="2"/></g>

<!-- large crown crest -->
<g transform="translate(360 74)" filter="url(#glow)">
  <path d="M-102 19C-68 15-52-2-38-28-22-57-11-65 0-65s22 8 38 37c14 26 30 43 64 47" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle r="67" fill="#030812" stroke="#00030a" stroke-width="12"/>
  <circle r="57" fill="url(#gem)" stroke="url(#gold)" stroke-width="6"/>
  <circle r="45" fill="none" stroke="#d8e2f0" stroke-width="1.3" opacity=".65"/>
  <circle r="34" fill="none" stroke="#d5b56e" stroke-width="1.2" opacity=".5" stroke-dasharray="3 7"/>
  <path d="M0-42L8-10 42 0 8 10 0 42-8 10-42 0-8-10Z" fill="#f0d99a"/>
  <path d="M0-22L4-5 22 0 4 5 0 22-4 5-22 0-4-5Z" fill="#fff7d0"/>
  <circle r="4" fill="#fff"/>
  <path d="M0 67v26" stroke="url(#gold)" stroke-width="5"/>
  <circle cy="101" r="9" fill="#7f91b8" stroke="#d5b56e" stroke-width="3"/>
</g>

<!-- curved engraved crown lines -->
<g fill="none" opacity=".55">
  <path d="M176 151C248 117 472 117 544 151" stroke="#8da0c7" stroke-width="1.5"/>
  <path d="M190 163C275 137 445 137 530 163" stroke="#d5b56e" stroke-width="1" stroke-dasharray="2 8"/>
  <path d="M176 929C248 963 472 963 544 929" stroke="#8da0c7" stroke-width="1.5"/>
  <path d="M190 917C275 943 445 943 530 917" stroke="#d5b56e" stroke-width="1" stroke-dasharray="2 8"/>
</g>

<!-- bottom micro seal -->
<g transform="translate(360 994)"><circle r="17" fill="#081122" stroke="url(#gold)" stroke-width="3.5"/><path d="M0-8l2.5 5.5L8 0 2.5 2.5 0 8-2.5 2.5-8 0-2.5-2.5z" fill="#ead294"/></g>
</svg>